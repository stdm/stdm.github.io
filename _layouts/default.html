<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>
		
		{% include meta.html %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:opsz,wght@14..32,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
    <link rel="icon" type="image/png" href="{{ site.favicon }}">

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
 		{% seo %}
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/home" class="site-avatar"><img src="{{ site.avatar }}" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/home">{{ site.name }}</a></h1>
            <p class="site-description">{{ site.description }}</p>
          </div>

          <nav>
          	<a href="{{ site.baseurl }}/home"{% if page.url contains '/home' %} class="active"{% endif %}>&#8962;</a>
            <a href="{{ site.baseurl }}/research"{% if page.url contains '/research' %} class="active"{% endif %}>Research</a>
            <a href="{{ site.baseurl }}/teaching"{% if page.url contains '/teaching' %} class="active"{% endif %}>Teaching</a>
            <!-- <a href="{{ site.baseurl }}/ai-course">AI</a>
            <a href="{{ site.baseurl }}/ml-course">ML</a> -->
            <a href="{{ site.baseurl }}/service"{% if page.url contains '/service' %} class="active"{% endif %}>Service</a>
            <a href="{{ site.baseurl }}/data-science-book"{% if page.url contains '/data-science-book' %} class="active"{% endif %}>Book</a>
            <a href="{{ site.baseurl }}/prayer"{% if page.url contains '/prayer' %} class="active"{% endif %}>Prayer</a>
            <a href="{{ site.baseurl }}/blog"{% if page.url contains '/blog' %} class="active"{% endif %}>Blog</a>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

  </body>
</html>
